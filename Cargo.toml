[package]
name = "saturnmac"
version = "0.1.0"
edition = "2021"
description = "Convert Sega Saturn game ROMs (BIN, CUE, ISO, CHD) into standalone native macOS applications optimized for Apple Silicon."
authors = ["carlosSP"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
encoding_rs = "0.8"
anyhow = "1.0"
zip = "9.6.0"
image = { version = "0.25", default-features = false, features = ["png"] }
